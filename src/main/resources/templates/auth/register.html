<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 shadow">
                    <h2 class="text-center mb-4">Create an Account</h2>

                    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control bg-dark text-light border-secondary" id="fullName" placeholder="John Doe" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" th:field="*{email}" class="form-control bg-dark text-light border-secondary" id="email" placeholder="name@arenahub.com" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number <span class="text-secondary">(Optional)</span></label>
                            <input type="text" th:field="*{phone}" class="form-control bg-dark text-light border-secondary" id="phone" placeholder="e.g. 9876543210" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control bg-dark text-light border-secondary" id="password" placeholder="At least 6 characters" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-accent">Register</button>
                        </div>
                    </form>

                    <div class="text-center mt-3 text-secondary">
                        Already have an account? <a th:href="@{/login}" class="text-info text-decoration-none">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
