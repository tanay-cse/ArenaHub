<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Tournament')}"></head>
<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4 shadow">
                    <h2 class="text-center mb-4">Create New Tournament</h2>

                    <form th:action="@{/admin/tournaments/new}" th:object="${tournament}" method="post">
                        <div class="mb-3">
                            <label for="gameSelect" class="form-label">Game</label>
                            <select id="gameSelect" th:field="*{game.id}" class="form-select bg-dark text-light border-secondary" required>
                                <option value="" disabled selected>-- Select a Game --</option>
                                <option th:each="g : ${games}" th:value="${g.id}" th:text="${g.title} + ' (' + ${g.platform} + ')'">Valorant (PC)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="tournamentName" class="form-label">Tournament Name</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="tournamentName" th:field="*{name}" required maxlength="150" placeholder="e.g. Valorant Campus Cup 2026">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="formatSelect" class="form-label">Format</label>
                                <select id="formatSelect" th:field="*{format}" class="form-select bg-dark text-light border-secondary" required>
                                    <option value="SINGLE_ELIMINATION">Single Elimination</option>
                                    <option value="DOUBLE_ELIMINATION">Double Elimination</option>
                                    <option value="ROUND_ROBIN">Round Robin</option>
                                    <option value="SWISS">Swiss</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="statusSelect" class="form-label">Status</label>
                                <select id="statusSelect" th:field="*{status}" class="form-select bg-dark text-light border-secondary" required>
                                    <option value="ANNOUNCED">ANNOUNCED</option>
                                    <option value="REGISTRATION_OPEN" selected>REGISTRATION_OPEN</option>
                                    <option value="IN_PROGRESS">IN_PROGRESS</option>
                                    <option value="COMPLETED">COMPLETED</option>
                                    <option value="CANCELLED">CANCELLED</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="maxParticipants" class="form-label">Max Players</label>
                                <input type="number" min="2" class="form-control bg-dark text-light border-secondary" id="maxParticipants" th:field="*{maxParticipants}" required placeholder="16">
                            </div>
                            <div class="col-md-4">
                                <label for="entryFee" class="form-label">Entry Fee (₹)</label>
                                <input type="number" step="0.01" min="0" class="form-control bg-dark text-light border-secondary" id="entryFee" th:field="*{entryFee}" required placeholder="0.00">
                            </div>
                            <div class="col-md-4">
                                <label for="prizePool" class="form-label">Prize Pool (₹)</label>
                                <input type="number" step="0.01" min="0" class="form-control bg-dark text-light border-secondary" id="prizePool" th:field="*{prizePool}" required placeholder="0.00">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="startTime" class="form-label">Tournament Start Time</label>
                            <input type="datetime-local" class="form-control bg-dark text-light border-secondary" id="startTime" th:field="*{startTime}" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-accent flex-grow-1">Create Tournament</button>
                            <a th:href="@{/tournaments}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
