<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gaming Stations')}"></head>
<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 mb-0">Gaming Stations & Catalog</h1>
            <span class="badge bg-secondary px-3 py-2 fs-6" th:text="${stations.size()} + ' Stations Available'">0 Stations</span>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-3" th:each="station : ${stations}">
                <div class="card h-100 shadow-sm border-secondary">
                    <div class="card-header bg-dark border-secondary d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-info" th:text="${station.stationNumber}">ST-01</span>
                        <span th:class="'badge ' + (${station.status == 'AVAILABLE'} ? 'bg-success' : (${station.status == 'OCCUPIED'} ? 'bg-danger' : 'bg-warning text-dark'))"
                              th:text="${station.status}">AVAILABLE</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <small class="text-secondary">Type:</small>
                            <span class="fw-semibold text-light ms-1" th:text="${station.stationType}">PC_VIP</span>
                        </div>
                        <div class="mb-3">
                            <small class="text-secondary">Hourly Rate:</small>
                            <span class="fw-bold text-warning ms-1" th:text="'₹' + ${station.hourlyRate} + ' / hr'">₹150.00 / hr</span>
                        </div>

                        <div>
                            <small class="text-secondary d-block mb-1">Installed Games:</small>
                            <div th:if="${#lists.isEmpty(station.stationGames)}">
                                <span class="text-muted small fst-italic">No games installed</span>
                            </div>
                            <div class="d-flex flex-wrap gap-1" th:unless="${#lists.isEmpty(station.stationGames)}">
                                <span class="badge bg-secondary" th:each="sg : ${station.stationGames}" th:text="${sg.game.title}">Game</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
