<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users')}"></head>
<body>
    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h2 mb-1">User Management</h1>
                <p class="text-secondary mb-0">View registered user accounts, manage active/banned status, and adjust loyalty points.</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a th:href="@{/admin}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
                <a th:href="@{/admin/rewards}" class="btn btn-outline-info btn-sm">Rewards</a>
                <a th:href="@{/admin/audit}" class="btn btn-outline-info btn-sm">Audit Logs</a>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-secondary">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">All Accounts</h5>
                <span class="badge bg-secondary" th:text="${users.size()} + ' users'">0 users</span>
            </div>

            <div th:if="${#lists.isEmpty(users)}" class="alert alert-secondary text-center my-3">
                <p class="mb-0">No users found.</p>
            </div>

            <div class="table-responsive" th:unless="${#lists.isEmpty(users)}">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Name</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Loyalty Balance</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="text-secondary small" th:text="${user.id}">1</td>
                            <td class="fw-semibold text-light" th:text="${user.email}">user@arenahub.com</td>
                            <td th:text="${user.fullName}">Full Name</td>
                            <td>
                                <span class="badge bg-secondary"
                                      th:classappend="${user.roleName == 'ADMIN'} ? 'bg-danger' : (${user.roleName == 'STAFF'} ? 'bg-info' : 'bg-primary')"
                                      th:text="${user.roleName}">STUDENT</span>
                            </td>
                            <td>
                                <span th:if="${user.isActive}" class="badge bg-success">ACTIVE</span>
                                <span th:unless="${user.isActive}" class="badge bg-danger">BANNED</span>
                            </td>
                            <td>
                                <span class="fw-bold text-warning" th:text="${user.pointsBalance} + ' pts'">0 pts</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <!-- Toggle Active (Ban/Unban) -->
                                    <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post" class="d-inline">
                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${user.isActive} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${user.isActive} ? 'Ban User' : 'Unban User'">
                                            Toggle Status
                                        </button>
                                    </form>

                                    <!-- Reset Points -->
                                    <form th:action="@{/admin/users/{id}/reset-points(id=${user.id})}" method="post" class="d-inline">
                                        <button type="submit"
                                                class="btn btn-outline-warning btn-sm"
                                                onclick="return confirm('Are you sure you want to reset this user\'s points balance to 0?');">
                                            Reset Points
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
